            <script>
            window.addEventListener('DOMContentLoaded', function() {
                var map = null;
                for (var key in window) {
                    if (window[key] && window[key]._leaflet_id && typeof window[key].getCenter === 'function') {
                        map = window[key];
                        break;
                    }
                }
                if (!map) return;

                map.setMaxZoom(22);

                // --- 1. PREVENT POPUPS FROM EVER AUTOPANNING / CENTERING THE MAP ---
                L.Popup.prototype.options.autoPan = false;

                L.control.scale({
                    position: 'bottomright',
                    maxWidth: 160,
                    metric: false,
                    imperial: true
                }).addTo(map);

                // --- 2. MEASURE CONTROL CONFIGURATION ---
                var isMeasuring = false;

                var measureControl = new L.Control.Measure({
                    position: 'topleft',
                    primaryLengthUnit: 'feet',
                    secondaryLengthUnit: 'miles',
                    primaryAreaUnit: 'sqfeet',
                    secondaryAreaUnit: 'acres',
                    activeColor: '#ffea00',
                    completedColor: '#ff9100',
                    captureZIndex: 10000,
                    autoPan: false,
                    popupOptions: {
                        autoPan: false,
                        keepInView: false,
                        closeButton: true
                    }
                });
                measureControl.addTo(map);

                // --- 3. HARD STATIONARY MAP LOCKDOWN ENGINE ---
                var origPanTo = map.panTo.bind(map);
                var origPanBy = map.panBy.bind(map);

                    return '<div style="font-family:-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; border-radius:6px; overflow:hidden; border:1px solid #cbd5e1; box-shadow:0 3px 12px rgba(0,0,0,0.15); min-width:280px; max-width:380px;">' +
                           '<div style="background:#002B49; color:white; padding:8px 12px; font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:space-between;">' +
                           '<span style="display:flex; align-items:center;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:' + color + '; margin-right:8px; border:1.5px solid #fff;"></span>' +
                           layerName.toUpperCase() + '</span>' +
                           '</div>' +
                           '<div style="max-height:280px; overflow-y:auto;"><table style="width:100%; border-collapse:collapse; line-height:1.4;">' +
                           rows + '</table></div></div>';
                }

                rawLayers.forEach(function(meta) {
                    var currentConfig = {
                        color: meta.color,
                        weight: meta.weight,
                        dashArray: meta.dashArray,
                        opacity: meta.opacity
                    };

                    function getStyle() {
                        return {
                            className: 'cad-feature-path',
                            color: currentConfig.color,
                            weight: currentConfig.weight,
                            dashArray: currentConfig.dashArray || null,
                            opacity: currentConfig.opacity,
                            fillColor: currentConfig.color,
                            fillOpacity: currentConfig.opacity * 0.4
                        };
                    }

                    var isNodeLayer = meta.name.indexOf('Node') !== -1;

                    var geoLayer = L.geoJSON(meta.data, {
                        style: getStyle,
                        pointToLayer: function(feature, latlng) {
                            if (isNodeLayer) {
                                return L.circleMarker(latlng, {
                                    className: 'cad-feature-path',
                                    radius: 5,
                                    color: '#002B49',
                                    weight: 2,
                                    fill: true,
                                    fillColor: '#ffffff',
                                    fillOpacity: 1.0
                                });
                            }
                            return L.circleMarker(latlng, {
                                className: 'cad-feature-path',
                                radius: parseInt(currentConfig.weight) + 3,
                                color: '#1e293b',
                                weight: 1.5,
                                fill: true,
                                fillColor: currentConfig.color,
                                fillOpacity: currentConfig.opacity
                            });
                        },
                        onEachFeature: function(feature, layer) {
                            layer.bindTooltip(meta.name, {
                                sticky: true,
                                className: 'pipe-label-tooltip'
                            });

                            layer.bindPopup(function() {
                                if (isMeasuring || calloutToolActive) return null;
                                return getPopupHTML(meta.name, feature.properties, currentConfig.color);
                            }, {
                                maxWidth: 420,
                                minWidth: 280,
                                autoPan: false
                            });

                            layer.on({
                                mouseover: function(e) {
                                    if (isMeasuring) return;
                                    var l = e.target;
                                    if (l.setStyle && !isNodeLayer) {
                                        l.setStyle({
                                            weight: Math.min(parseInt(currentConfig.weight) + 3, 20),
                                            opacity: 1.0
                                        });
                                    }
                                },
                                mouseout: function(e) {
                                    var l = e.target;
                                    if (l.setStyle && !isNodeLayer) {
                                        l.setStyle(getStyle());
                                    }
                                }
                            });
                        }
                    }).addTo(map);

                    registeredLayers.push({ layer: geoLayer, meta: meta, config: currentConfig });

                    var overlayLabel = '<span id="legend-tag-' + meta.id + '" style="color:' + currentConfig.color + '">●</span> ' + meta.name;
                    overlayMaps[overlayLabel] = geoLayer;

                    var styleOptionsHTML = '';
                    for (var styleName in availableLineStyles) {
                        var patternVal = availableLineStyles[styleName];
                        var isSel = (patternVal === currentConfig.dashArray) ? 'selected' : '';
                        styleOptionsHTML += '<option value="' + patternVal + '" ' + isSel + '>' + styleName + '</option>';
                    }

                    var card = document.createElement('div');
                    card.style.cssText = 'background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:10px; margin-bottom:10px;';
                    card.innerHTML = 
                        '<div style="font-weight:700; color:#0f172a; margin-bottom:8px;">' + meta.name + '</div>' +
                        '<div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">' +
                            '<div>' +
                                '<label style="font-size:10px; font-weight:700; color:#64748b; display:block;">COLOR</label>' +
                                '<input type="color" id="clr-' + meta.id + '" value="' + currentConfig.color + '" style="width:100%; height:28px; border:none; border-radius:4px; cursor:pointer;">' +
                            '</div>' +
                            '<div>' +
                                '<label style="font-size:10px; font-weight:700; color:#64748b; display:block;">WEIGHT / SIZE</label>' +
                                '<input type="number" id="wgt-' + meta.id + '" value="' + currentConfig.weight + '" min="1" max="25" style="width:90%; height:24px; padding:2px 4px; border:1px solid #cbd5e1; border-radius:4px;">' +
                            '</div>' +
                        '</div>' +
                        '<div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;">' +
                            '<div>' +
                                '<label style="font-size:10px; font-weight:700; color:#64748b; display:block;">LINE PATTERN</label>' +
                                '<select id="dash-' + meta.id + '" style="width:100%; height:28px; border:1px solid #cbd5e1; border-radius:4px; font-size:11px;">' +
                                    styleOptionsHTML +
                                '</select>' +
                            '</div>' +
                            '<div>' +
                                '<label style="font-size:10px; font-weight:700; color:#64748b; display:block;">OPACITY (%)</label>' +
                                '<input type="number" id="opc-' + meta.id + '" value="' + Math.round(currentConfig.opacity * 100) + '" min="10" max="100" step="10" style="width:90%; height:24px; padding:2px 4px; border:1px solid #cbd5e1; border-radius:4px;">' +
                            '</div>' +
                        '</div>';
                    panelBody.appendChild(card);

                    function updateLayerLive() {
                        var newColor = document.getElementById('clr-' + meta.id).value;
                        var newWeight = parseInt(document.getElementById('wgt-' + meta.id).value);
                        var newDash = document.getElementById('dash-' + meta.id).value;
                        var newOpacity = parseInt(document.getElementById('opc-' + meta.id).value) / 100.0;

                        currentConfig.color = newColor;
                        currentConfig.weight = newWeight;
                        currentConfig.dashArray = newDash;
                        currentConfig.opacity = newOpacity;

                        geoLayer.eachLayer(function(l) {
                            if (l.setStyle) l.setStyle(getStyle());
                            if (l.setRadius) {
                                l.setRadius(newWeight + 3);
                                l.setStyle({ fillColor: newColor, fillOpacity: newOpacity });
                            }
                        });

                        var tag = document.getElementById('legend-tag-' + meta.id);
                        if (tag) tag.style.color = newColor;

                        updateViewportCallouts();
                    }

                    document.getElementById('clr-' + meta.id).addEventListener('input', updateLayerLive);
                    document.getElementById('wgt-' + meta.id).addEventListener('change', updateLayerLive);
                    document.getElementById('dash-' + meta.id).addEventListener('change', updateLayerLive);
                    document.getElementById('opc-' + meta.id).addEventListener('change', updateLayerLive);
                });

                L.control.layers(baseMaps, overlayMaps, {collapsed: false, position: 'topright'}).addTo(map);

                // DYNAMIC VIEWPORT CALLOUT ENGINE: Strictly ONE callout per visible element
                function updateViewportCallouts() {
                    calloutLayerGroup.clearLayers();
                    if (!map.hasLayer(calloutLayerGroup)) return;

                    var viewBounds = map.getBounds();
                    var viewCenter = viewBounds.getCenter();

                    registeredLayers.forEach(function(item) {
                        var geoLayer = item.layer;
                        var meta = item.meta;
                        var config = item.config;

                        if (!map.hasLayer(geoLayer)) return;
                        if (meta.name.indexOf('Node') !== -1) return;

                        var bestPoint = null;
                        var closestDist = Infinity;

                        geoLayer.eachLayer(function(subLayer) {
                            var pt = null;
                            if (subLayer.getLatLng) {
                                pt = subLayer.getLatLng();
                            } else if (subLayer.getBounds) {
                                var b = subLayer.getBounds();
                                if (viewBounds.intersects(b)) {
                                    pt = b.getCenter();
                                }
                            }

                            if (pt && viewBounds.contains(pt)) {
                                var dist = viewCenter.distanceTo(pt);
                                if (dist < closestDist) {
                                    closestDist = dist;
                                    bestPoint = pt;
                                }
                            }
                        });

                        if (bestPoint) {
                            var badgeIcon = L.divIcon({
                                className: '',
                                html: '<div class="cad-callout-badge" style="border-left: 5px solid ' + config.color + ';">' + meta.name + '</div>',
                                iconSize: [null, null],
                                iconAnchor: [0, 0]
                            });
                            L.marker(bestPoint, {
                                icon: badgeIcon,
                                interactive: true,
                                zIndexOffset: 1000
                            }).addTo(calloutLayerGroup);
                        }
                    });
                }

                map.on('moveend zoomend', updateViewportCallouts);
                map.on('overlayadd overlayremove', updateViewportCallouts);
                updateViewportCallouts();

                // Interactive Manual Placement Tool
                var calloutToolActive = false;
                var CalloutControl = L.Control.extend({
                    options: { position: 'topleft' },
                    onAdd: function(m) {
                        var container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
                        var btn = L.DomUtil.create('a', '', container);
                        btn.innerHTML = '🏷️';
                        btn.title = 'Place Custom Callout on Map';
                        btn.style.cssText = 'font-size:16px; display:flex; align-items:center; justify-content:center; width:34px; height:34px; background:#fff; cursor:pointer; user-select:none;';

                        L.DomEvent.on(btn, 'click', function(e) {
                            L.DomEvent.stopPropagation(e);
                            calloutToolActive = !calloutToolActive;
                            btn.style.background = calloutToolActive ? '#0284c7' : '#ffffff';
                            btn.style.color = calloutToolActive ? '#ffffff' : '#000000';
                            map.getContainer().style.cursor = calloutToolActive ? 'crosshair' : '';
                        });
                        return container;
                    }
                });
                map.addControl(new CalloutControl());

                map.on('click', function(e) {
                    if (!calloutToolActive) return;
                    var labelText = prompt("Enter callout label text:", '12" Waterline');
                    if (labelText && labelText.trim()) {
                        var customBadge = L.divIcon({
                            className: '',
                            html: '<div class="cad-callout-badge" style="border-left: 5px solid #004B87;">' + labelText.trim() + '</div>',
                            iconSize: [null, null],
                            iconAnchor: [0, 0]
                        });
                        var marker = L.marker(e.latlng, { icon: customBadge, draggable: true }).addTo(calloutLayerGroup);
                        marker.bindPopup("<b>" + labelText + "</b><br><small>Draggable Callout</small>");
                    }
                    calloutToolActive = false;
                    map.getContainer().style.cursor = '';
                    var calloutBtn = document.querySelector('.leaflet-control a[title*="Place Custom Callout"]');
                    if (calloutBtn) calloutBtn.style.background = '#ffffff';
                });

                var header = document.getElementById('symbology-header');
                var body = document.getElementById('symbology-body');
                var icon = document.getElementById('toggle-icon');
                var collapsed = false;

                header.addEventListener('click', function() {
                    collapsed = !collapsed;
                    body.style.display = collapsed ? 'none' : 'block';
                    icon.textContent = collapsed ? '▲' : '▼';
                });
            });
            </script>
            
    
            <div class="folium-map" id="map_25d40e259c51d912fe87d1b226664507" ></div>
        
</body>
